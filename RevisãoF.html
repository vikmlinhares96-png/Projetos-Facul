<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Loja de Matcha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        
        .cabecalho {
            text-align: center;
            margin-bottom: 20px;
        }

        .tag {
            background-color: #d1d5db;
            padding: 2px 8px;
            font-weight: bold;
        }

        
        .container {
            background-color: #6b7280;
            color: white;
            padding: 30px;
            width: 700px;
            margin: 0 auto;
        }

        
        .titulo-shop {
            margin-top: 0;
            font-size: 24px;
        }

        
        .produtos {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .item {
            width: 30%;
        }

        
        .item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e5e7eb;
        }

       
        .item h3 {
            font-size: 14px;
            margin: 10px 0 2px 0;
            font-weight: normal;
        }

        .item p {
            font-size: 12px;
            color: #d1d5db;
            margin: 0;
        }

        
        .area-botao {
            text-align: center;
        }

        .btn-shop {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    
    <div class="cabecalho">
        <span>Exercício Revisão Prova</span>
        <span class="tag">Matcha</span>
    </div>

    
    <div class="container">
        <h2 class="titulo-shop">Shop</h2>

        <div class="produtos">
          
            <div class="item">
                <img src="c:\Users\2026203130\Desktop\Matcha1.png" alt="Iced Matcha Latte">
                <h3>Iced Matcha Latte</h3>
                <p>R$100>
            </div>

            
            <div class="item">
                <img src="c:\Users\2026203130\Desktop\Mtacha2.png" alt="Matcha em Pó Puro">
                <h3>Matcha Premium Pó</h3>
                <p>R$35.00</p>
            </div>

           
            <div class="item">
                <img src="Matcha3.png" alt="Kit Acessórios Matcha">
                <h3>Kit Chasen & Chawan</h3>
                <p>R$45.00</p>
            </div>
        </div>

        
        <div class="area-botao">
            <button class="btn-shop">Shop Now</button>
        </div>
    </div>

</body>
</html>
</body>
</html>
